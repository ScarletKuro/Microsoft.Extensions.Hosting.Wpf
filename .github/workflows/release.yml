name: release

on:
  push:
    tags:
      - '*'

jobs:
  publish:
    name: Publish release packages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Validate release tag
        shell: pwsh
        run: |
          if ("${env:GITHUB_REF_NAME}" -notmatch '^[0-9]+\.[0-9]+\.[0-9]+$') {
            Write-Error "Tag ${env:GITHUB_REF_NAME} is not a release tag in X.Y.Z form."
          }

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: |
            src/**/*.csproj
            version.json

      - name: Restore
        run: dotnet restore src/Microsoft.Extensions.Hosting.Wpf.sln

      - name: Build
        run: dotnet build src/Microsoft.Extensions.Hosting.Wpf.sln -c Release --no-restore

      - name: Pack
        run: dotnet pack src/Microsoft.Extensions.Hosting.Wpf.sln -c Release --no-build -o artifacts/packages

      - name: NuGet login
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Publish to NuGet.org
        shell: bash
        run: dotnet nuget push "artifacts/packages/*.nupkg" --source "https://api.nuget.org/v3/index.json" --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" --skip-duplicate

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: packages
          path: artifacts/packages
