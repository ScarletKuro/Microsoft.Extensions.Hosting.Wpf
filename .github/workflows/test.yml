name: test

# Reusable: called by continuous.yml (branch pushes) and release.yml (before publishing).
on:
  workflow_call:

jobs:
  test:
    name: Test WPF hosting on Windows
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            6.0.x
            7.0.x
            8.0.x
            9.0.x
            10.0.x

      # Microsoft Code Coverage (part of Microsoft.NET.Test.Sdk) also collects from child processes, so the scenario
      # tests, which run the library in their own processes, count towards coverage.
      - name: Test
        run: >
          dotnet test tests/Microsoft.Extensions.Hosting.Wpf.Tests/Microsoft.Extensions.Hosting.Wpf.Tests.csproj -c Release
          --collect "Code Coverage;Format=cobertura"
          --results-directory ./coverage

      # Listed explicitly: Codecov's report discovery does not recognise "*.cobertura.xml" file names.
      # Not fatal: a Codecov outage must not block a release (release.yml runs this workflow).
      - name: Upload coverage to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/**/*.cobertura.xml
          fail_ci_if_error: false
