name: continuous

on:
  # Branches only: release tags are built, tested and published by release.yml.
  push:
    branches:
      - '**'

jobs:
  test:
    uses: ./.github/workflows/test.yml
    secrets: inherit

  build:
    name: Build and pack
    runs-on: ubuntu-latest
    env:
      # Identifies which push a CI package came from; release versions come from the tag (release.yml).
      CI_VERSION: 0.0.0-ci.${{ github.run_number }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: src/**/*.csproj

      - name: Restore
        run: dotnet restore Microsoft.Extensions.Hosting.Wpf.slnx

      - name: Build
        run: dotnet build Microsoft.Extensions.Hosting.Wpf.slnx -c Release --no-restore -p:Version=${{ env.CI_VERSION }}

      - name: Pack
        run: dotnet pack Microsoft.Extensions.Hosting.Wpf.slnx -c Release --no-build -o artifacts/packages -p:Version=${{ env.CI_VERSION }}

      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: packages
          path: artifacts/packages
