name: continuous

on:
  push:

jobs:
  build:
    name: Build and pack
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: |
            src/**/*.csproj
            version.json

      - name: Restore
        run: dotnet restore Microsoft.Extensions.Hosting.Wpf.slnx

      - name: Build
        run: dotnet build Microsoft.Extensions.Hosting.Wpf.slnx -c Release --no-restore

      - name: Pack
        run: dotnet pack Microsoft.Extensions.Hosting.Wpf.slnx -c Release --no-build -o artifacts/packages

      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: packages
          path: artifacts/packages
